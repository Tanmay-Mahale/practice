<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h2>Registation Form</h2>
    <form id="form">
        <label for="name">Name :</label>
        <input type="text" id="name" name="name" required ><br/><br/>
        <label for="id">ID :</label>
        <input type="text" id="id" name="id" required><br/><br/>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required><br/><br/>
        <label for="degree">Degree :</label>
        <select for="degree" id="degree" name="degree">
            <option value="BCA">BCA</option>
            <option value="BCOM">BCOM</option>
            <option value="BBA">BBA</option>
        </select><br/><br/>
        <label for="year">Year :</label>
        <section id="year" required>
            <label for="first">First </label>
            <input type="radio" id="first" name="year" value="first">
            <label for="second">Second</label>
            <input type="radio" id="second" name="year" value="second">
            <label for="third">Third</label>
            <input type="radio" id="third" name="year" value="third">
        </section><br/><br/>
        <label for="hobby">Hobby :</label>
        <section id="hobby" required>
            <label for="sport">Sport </label>
            <input type="checkbox" id="sport" name="hobby" value="sport">
            <label for="singing">Singing</label>
            <input type="checkbox" id="singing" name="hobby" value="singing">
            <label for="reading">Reading</label>
            <input type="checkbox" id="reading" name="hobby" value="reading">
        </section><br/>

        <button type="submit" >Submit</button>

    </form>

    <script>
        let url="PASTE_URL";
        
        let form=document.getElementById("form");

        form.addEventListener("submit",function(ev){
            ev.preventDefault();

            fetch(url,{method:"POST",body:new FormData(form)})
            .then(function(){
                alert("successfully Inserted")
                form.reset();
            })
            .catch(function(){
                alert("error found")
            })
        })
    </script>
</body>
</html>
